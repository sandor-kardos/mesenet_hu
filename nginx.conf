server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Enable Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml;

    # Security Headers (Grade A+ on SecurityHeaders.com)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://stats.sandorkardos.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://api.mesenet.hu https://*.mesenet.hu; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.mesenet.hu https://stats.sandorkardos.com https://cloudflareinsights.com https://*.cloudflare.com; frame-ancestors 'self'; upgrade-insecure-requests;" always;

    # 1. Old spam .php URLs -> 410 Gone (tells Google to permanently de-index)
    location ~* \.php$ {
        return 410;
    }

    # 2. Block hidden dotfiles (.env, .git, etc.) except .well-known
    location ~ /\.(?!well-known) {
        return 404;
    }

    # 3. Immutable 1-year cache for hashed Vite build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # 4. Never cache Service Worker or HTML so updates deploy immediately
    location ~* ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://stats.sandorkardos.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://api.mesenet.hu https://*.mesenet.hu; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.mesenet.hu https://stats.sandorkardos.com https://cloudflareinsights.com https://*.cloudflare.com; frame-ancestors 'self'; upgrade-insecure-requests;" always;
    }

    # 5. SPA Fallback for all React Router deep links (/mese/*, /read/*, /discover, /log, /profile)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
