<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="mesenet.hu · Meseolvasó alkalmazás gyerekeknek és szülőknek. Válogass mesékből tanulság, korosztály és hangulat szerint." />
    <meta name="theme-color" content="#6C63FF" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>" />
    <title>mesenet.hu · Mesék, amik számítanak</title>

    <!-- Preconnect to critical origins (saves ~660ms on 4G) -->
    <link rel="preconnect" href="https://api.mesenet.hu" crossorigin />
    <link rel="preconnect" href="https://stats.sandorkardos.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Parallel API Prefetch: eliminates sequential JS -> API waterfall for LCP -->
    <script>
      window.__MESENET_STORIES_PROMISE__ = fetch('https://api.mesenet.hu/wp-json/wp/v2/mese?_embed&per_page=100')
        .then(function(r) { return r.ok ? r.json() : null; })
        .catch(function() { return null; });
    </script>

    <!-- Non-render-blocking Google Fonts -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" />
    </noscript>

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mesenet.hu/" />
    <meta property="og:site_name" content="Mesenet.hu" />
